<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121214" />
  <title>Order your meal prep</title>
  <meta name="description" content="Order this week's fitness-friendly meal prep: pick your meals, see your macros, choose delivery or pickup." />
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="manifest" href="order.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fuel Order" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/order.css" />
</head>
<body class="shop">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark"><img src="img/icon-180.png" alt="" width="40" height="40" /></span>
        <div>
          <div class="brand-name" id="shop-name">Meal Prep</div>
          <div class="brand-sub" id="shop-tagline">Order online</div>
        </div>
      </div>
    </div>
  </header>

  <main id="shop" class="container" aria-live="polite"><div class="empty">Loading the menu…</div></main>

  <div class="cart-bar" id="cart-bar" hidden>
    <div><strong id="cart-count">0 meals</strong> · <span id="cart-total">$0.00</span></div>
    <a class="btn" href="#checkout">Checkout</a>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/shoptools.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
