<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121214" />
  <title>Fuel by Buzah — Meal Prep Manager</title>
  <meta name="description" content="Weekly meal-prep orders, macros, shopping lists, delivery sheets and invoices." />
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark"><img src="img/icon-180.png" alt="" width="40" height="40" /></span>
        <div>
          <div class="brand-name" id="brand-name">Fuel by Buzah</div>
          <div class="brand-sub">Meal Prep Manager</div>
        </div>
        <button class="sync-pill" id="sync-pill" data-action="sync-pill" data-state="saved" title="Storage status">Synced</button>
      </div>
      <div class="week-nav" aria-label="Choose week">
        <button class="icon-btn" data-action="week-prev" aria-label="Previous week">‹</button>
        <div class="week-picker">
          <button type="button" class="week-label" id="week-btn" data-action="week-picker" aria-haspopup="dialog" aria-expanded="false" aria-controls="week-pop" title="Pick a week on the calendar">
            <span><span id="week-title">Week of —</span> <span class="caret" aria-hidden="true">▾</span></span>
            <span class="muted small" id="week-sub"></span>
          </button>
          <div class="week-pop" id="week-pop" role="dialog" aria-label="Pick a week" hidden></div>
        </div>
        <button class="icon-btn" data-action="week-next" aria-label="Next week">›</button>
        <button class="btn btn-ghost btn-sm" data-action="week-today">This week</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="dashboard">Dashboard</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="menu">Menu</button>
      <button data-tab="customers">Customers</button>
      <button data-tab="prep">Saturday Prep</button>
      <button data-tab="deliveries">Sunday Deliveries</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="app" class="container" tabindex="-1"><div class="empty">Loading…</div></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer container muted small">
    Fuel by Buzah · Meal Prep Manager
  </footer>

  <!-- Supabase client (cloud sync). If it can't load, the app falls back to this browser's storage. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/route.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
